<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{background:#181f2e}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>100 Square Jigsaw | MathWithShoaib</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one panel holding both the 10x10 board and the piece tray. The
   board floats to the right, so pieces wrap along its left side first and
   then continue at full width once past its bottom edge — one box with
   pieces on two sides of the board, instead of a side column too narrow to
   show 15+ irregularly-shaped pieces without a lot of scrolling. On narrow
   screens the float is dropped (board on top, pieces below) since there's
   no room for anything to sit beside it. Pieces are drawn at one shared
   cell size so a piece in the tray matches the board exactly.
   Theme: re-mapped to mathwithshoaib.com's dark palette (site is dark-only, no
   light mode, so the colors below are hardcoded instead of following
   prefers-color-scheme). */
:root {
  --bg: #181f2e;
  --surface: #1e2840;
  --ink: #e8e2d8;
  --muted: #a8b0c0;
  --line: rgba(255, 255, 255, 0.14);
  --accent: #e8a020;
  --accent-ink: #181f2e;
  --board: #1b2438;
  --grid: rgba(255, 255, 255, 0.10);
  --edge: #e8e2d8;
  --cell-line: rgba(232, 226, 216, 0.22);
  --piece-ink: #e8e2d8;
  --good: #38c9b0;
  --bad: #e06b6b;
  --hint: #9b80e8;
  --p0: #7b3340; --p1: #7a5a2a; --p2: #6f6a24; --p3: #3f6a2c;
  --p4: #2a6a52; --p5: #286674; --p6: #34559b; --p7: #5a4a96;
  --p8: #8a4a82; --p9: #4a5568; --p10: #8a4f33; --p11: #2b6d66;
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
  --cell: 36px;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-inline: 16px;
  padding-block: 14px 24px;
}
.app { max-width: 1120px; margin: 0 auto; display: grid; gap: 12px; }
header { margin-bottom: 2px; }
.credit { margin: 0; font-size: 0.8rem; color: var(--muted); }
.credit a { color: var(--accent); }

.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab {
  font: inherit; font-weight: 700; cursor: pointer; min-height: 44px;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 8px 16px; border-radius: 10px;
}
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab .tick { margin-left: 6px; }
.desc { margin: 0; min-height: 1.5em; }

.panel {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; padding: 12px; min-width: 0;
}
/* Board floats inside the same panel as the pieces, so pieces wrap along its
   left side first and then continue full-width below it — one box holding
   everything, instead of a separate board column pushing pieces far down. */
.stage::after { content: ''; display: block; clear: both; }
.boardblock {
  float: right;
  width: calc(var(--cell) * 10);
  margin: 0 0 16px 16px;
  display: grid; gap: 8px; justify-items: center;
}
.stage h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; margin: 0; }
@media (max-width: 620px) {
  .boardblock { float: none; margin: 0 auto 16px; }
}
.meta {
  display: flex; justify-content: space-between; gap: 12px; width: 100%;
  font-weight: 700; font-variant-numeric: tabular-nums;
}
#board {
  position: relative;
  width: calc(var(--cell) * 10);
  height: calc(var(--cell) * 10);
  background-color: var(--board);
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size: var(--cell) var(--cell);
  outline: 2px solid var(--edge);
  flex: none;
}
.actions { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
.btn {
  font: inherit; font-weight: 700; cursor: pointer; min-height: 44px;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 8px 16px; border-radius: 10px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab:focus-visible, .btn:focus-visible, .piece:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.status { margin: 0; width: 100%; min-height: 3em; }
.win {
  width: 100%; display: grid; gap: 10px; padding: 12px;
  border: 2px solid var(--good); border-radius: 12px;
}
.win strong { font-family: var(--font-display); font-size: 1.25rem; }

.traynote { margin: 2px 0 0; color: var(--muted); font-size: 0.88rem; }
.tray { padding-top: 10px; }
.empty { color: var(--muted); margin: 0; }

.piece { position: relative; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.piece:not(.onboard) { display: inline-block; vertical-align: top; margin: 0 10px 10px 0; }
.piece.onboard { position: absolute; }
.piece.locked { cursor: default; }
.cell {
  position: absolute; box-sizing: border-box;
  width: var(--cell); height: var(--cell);
  background: var(--fill);
  border: 1px solid var(--cell-line);
  display: grid; place-items: center;
  font-size: calc(var(--cell) * 0.4);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--piece-ink);
}
.cell.t { border-top: 2px solid var(--edge); }
.cell.b { border-bottom: 2px solid var(--edge); }
.cell.l { border-left: 2px solid var(--edge); }
.cell.r { border-right: 2px solid var(--edge); }
.cell.rev { opacity: 0.55; }
.piece.sel { transform: translateY(-3px); filter: drop-shadow(0 0 2px var(--accent)) drop-shadow(0 0 3px var(--accent)); }
.piece.wrong { filter: drop-shadow(0 0 2px var(--bad)) drop-shadow(0 0 3px var(--bad)); }
.piece.hinted { filter: drop-shadow(0 0 3px var(--hint)) drop-shadow(0 0 4px var(--hint)); animation: pulse 1s ease-in-out infinite; }
.piece.lifted { opacity: 0.25; }
.ghost { position: fixed; z-index: 60; pointer-events: none; filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.3)); }
@keyframes pulse { 50% { transform: translateY(-3px); } }

.pv, .ht { position: absolute; box-sizing: border-box; width: var(--cell); height: var(--cell); pointer-events: none; z-index: 5; }
.pv.ok { background: rgba(56, 201, 176, 0.3); outline: 2px solid var(--good); outline-offset: -2px; }
.pv.no { background: rgba(224, 107, 107, 0.28); outline: 2px solid var(--bad); outline-offset: -2px; }
.ht { background: rgba(155, 128, 232, 0.28); outline: 3px dashed var(--hint); outline-offset: -3px; }
.band {
  position: absolute; left: 0; width: 100%; box-sizing: border-box; pointer-events: none; z-index: 4;
  background: rgba(155, 128, 232, 0.18);
  border-block: 2px dashed var(--hint);
}

@media (max-width: 600px) { .panel { padding: 8px; } .piece:not(.onboard) { margin: 0 8px 8px 0; } }
@media (prefers-reduced-motion: reduce) { .piece.hinted { animation: none; } }
</style>

<div class="app">
  <header>
    <p class="credit">Inspired by the NRICH task <a href="https://nrich.maths.org/problems/100-square-jigsaw?tab=overview" target="_blank" rel="noopener">100 Square Jigsaw</a> from the University of Cambridge.</p>
  </header>

  <div class="tabs" role="tablist" aria-label="Puzzles" id="tabs"></div>
  <p class="desc" id="desc"></p>

  <section class="panel stage" aria-label="100 square puzzle">
    <div class="boardblock" role="group" aria-label="The 100 square">
      <div class="meta"><span id="progress"></span><span id="timer" aria-label="Time">0:00</span></div>
      <div id="board" aria-label="Hundred square board, 10 rows of 10"></div>
      <div class="actions">
        <button class="btn primary" id="check" type="button">Check</button>
        <button class="btn" id="hint" type="button">Hint</button>
        <button class="btn" id="reset" type="button">Start over</button>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
      <div class="win" id="win" hidden>
        <strong id="winTitle"></strong>
        <span id="winText"></span>
        <div class="actions"><button class="btn primary" id="next" type="button"></button></div>
      </div>
    </div>

    <h2>Pieces</h2>
    <p class="traynote" id="traynote"></p>
    <div class="tray" id="tray"></div>
  </section>
</div>

<script>
(function () {
  'use strict';
  var N = 10;

  var DEFS = [
    { name: 'Puzzle 1', base: 1, flip: false, seed: 11, desc: 'Numbers 1 to 100. Every number is showing.',
      pieces: [[95,96,97,98,99,100],[5,6,7,16,26,36],[19,29,28,39,49,59,58],[15,25,35,45,46,55,54],[10,20,30,40,50],[11,21,22,31,41,51],[43,44,53,63,73,72],[12,13,23,33,32,42,52],[38,48,47,57],[1,2,3,4,14,24,34],[8,9,18,17,27,37],[61,62,71,81,91,92],[74,82,83,84,85,93,94],[56,64,65,66,67,68],[75,76,77,86,87,88,89],[60,70,69,79,78,80,90]] },
    { name: 'Puzzle 2', base: 0, flip: false, seed: 12, desc: 'Numbers 0 to 99. This time the square starts at zero.',
      pieces: [[1,2,3,12,13,22,32,31,42],[57,59,67,68,69,77,78,79,89],[34,37,44,45,46,47,54,55,56],[72,73,81,82,83,90,91,92,93],[63,64,65,66,74,75,76,85,86],[8,9,19,28,29,38,39,48,49,58],[0,10,11,20,21,30,40,41,50],[4,5,14,15,23,24,25,33,43],[6,7,16,17,18,26,27,35,36],[51,52,53,60,61,62,70,71,80],[84,94,95,96,97,98,99,87,88]] },
    { name: 'Puzzle 3', base: 1, flip: true, seed: 13, desc: 'Numbers 1 to 100. Look carefully at which way the numbers run.',
      pieces: [[1,2,3,4,5],[15,16,25,26,35,36,46,47],[91,92,82,72,62,52,53],[90,80,79,70,60,50],[81,71,61,51,41,42,43,32],[27,17,6,7,8,9],[49,39,40,30,20,10],[74,75,76,65,66],[48,37,38,28,29,18,19],[69,58,59],[99,100,88,89,77,78],[44,45,33,34,22,23],[93,94,95,96,83,73,63],[64,54,55,56,57,67,68],[97,98,84,85,86,87],[31,21,11,12,13,14,24]] },
    { name: 'Puzzle 4', base: 0, flip: true, seed: 14, desc: 'Numbers 0 to 99. Look carefully at which way the numbers run.',
      pieces: [[32,33,22,12,2,1],[58,46,47,48,49,39,29,19],[37,38,28,18,7,8,9],[80,81,70,60,61,62,52],[64,65,55,45,35,36,26],[63,53,43,42,41,31,21],[50,51,40,30,20,10,11,0],[99,89,79,78,77,76,66],[54,44,34,23,24,25,13,14],[90,91,92,93,94,82,84,71,72],[83,73,74,75,85,86,87],[27,17,16,15,6,5,4,3],[67,68,69,59,56,57],[95,96,97,98,88]] },
    { name: 'Hard', base: 0, flip: true, seed: 15, desc: 'Numbers 0 to 99 again, but some numbers are missing from the pieces.',
      pieces: [[42,52,53,63,71,72,73],[28,38,47,48,57,67,68],[86,92,93,94,95,96,97],[11,12,22,30,31,32,33,41],[39,49,58,59,69,79],[5,14,15,25,26,34,35,45],[0,1,10,20,21],[7,8,9,19,29],[36,37,46,56,65,66,75,76,77],[2,3,4,13,23,24],[60,70,80,81,82,83,90,91],[43,44,54,55,64,74,84,85],[6,16,17,18,27],[40,50,51,61,62],[78,87,88,89,98,99]],
      hidden: [1,3,5,7,9,10,11,13,14,15,17,18,21,23,26,27,29,32,33,36,38,41,42,43,44,48,51,55,57,58,59,61,62,65,67,70,71,72,73,74,75,76,77,78,79,81,82,86,87,89,90,93,94,95] }
  ];

  function rng(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function build(def) {
    var hidden = {};
    (def.hidden || []).forEach(function (n) { hidden[n] = 1; });
    function pos(n) {
      var k = n - def.base;
      return { r: def.flip ? 9 - Math.floor(k / 10) : Math.floor(k / 10), c: k % 10 };
    }
    var owner = {};
    var pieces = def.pieces.map(function (nums, i) {
      var cs = nums.map(function (n) {
        var q = pos(n);
        owner[q.r + ',' + q.c] = i;
        return { r: q.r, c: q.c, n: n, show: !hidden[n] };
      });
      var r0 = Math.min.apply(null, cs.map(function (x) { return x.r; }));
      var c0 = Math.min.apply(null, cs.map(function (x) { return x.c; }));
      var r1 = Math.max.apply(null, cs.map(function (x) { return x.r; }));
      var c1 = Math.max.apply(null, cs.map(function (x) { return x.c; }));
      var rel = cs.map(function (x) { return { r: x.r - r0, c: x.c - c0, n: x.n, show: x.show }; });
      rel.sort(function (a, b) { return a.r - b.r || a.c - b.c; });
      var set = {};
      rel.forEach(function (x) { set[x.r + ',' + x.c] = 1; });
      rel.forEach(function (x) {
        x.t = !set[(x.r - 1) + ',' + x.c]; x.b = !set[(x.r + 1) + ',' + x.c];
        x.l = !set[x.r + ',' + (x.c - 1)]; x.rt = !set[x.r + ',' + (x.c + 1)];
      });
      return { id: i, color: 0, r0: r0, c0: c0, w: c1 - c0 + 1, h: r1 - r0 + 1, cells: rel, anchorC: rel[0].c };
    });
    // Colour pieces so that touching pieces never share a colour.
    var nb = pieces.map(function () { return {}; });
    Object.keys(owner).forEach(function (k) {
      var rc = k.split(',').map(Number);
      [[1, 0], [0, 1]].forEach(function (d) {
        var o = owner[(rc[0] + d[0]) + ',' + (rc[1] + d[1])];
        if (o !== undefined && o !== owner[k]) { nb[owner[k]][o] = 1; nb[o][owner[k]] = 1; }
      });
    });
    pieces.forEach(function (p, i) {
      var used = {};
      Object.keys(nb[i]).forEach(function (o) { if (+o < i) used[pieces[+o].color] = 1; });
      var k = 0;
      while (used[k]) k++;
      p.color = k % 12;
    });
    var rnd = rng(def.seed || 7);
    var order = pieces.map(function (p) { return p.id; });
    for (var i = order.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
    }
    return { name: def.name, desc: def.desc, base: def.base, pieces: pieces, order: order };
  }

  var puzzles = DEFS.map(build);
  function fresh() { return { placed: {}, elapsed: 0, started: false, solved: false, sel: null, msg: '', flash: null, hint: null, hl: {} }; }
  var state = puzzles.map(fresh);
  var idx = 0;
  var cellPx = 40;

  var $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement;
  var board = $('board'), tray = $('tray');
  function cur() { return state[idx]; }
  function P() { return puzzles[idx]; }

  // ── Parent-page bridge: lets the Next.js wrapper auto-size the iframe
  // and know when the puzzle has actually been played (not just loaded). ──
  function notifyParent(type, extra) {
    try {
      var msg = { source: 'mws-jigsaw', type: type };
      if (extra) for (var k in extra) msg[k] = extra[k];
      window.parent.postMessage(msg, window.location.origin);
    } catch (e) { /* no parent, or cross-origin — ignore */ }
  }
  function reportHeight() {
    notifyParent('resize', { height: document.documentElement.scrollHeight });
  }

  function fit() {
    // Board and tray are always full width (stacked, not side-by-side), so
    // cell size is based on the full available width, not a shared column —
    // capped fairly small so the board+tray together stay compact and the
    // whole puzzle fits comfortably in one screen without much scrolling.
    var vw = root.clientWidth;
    var reserve = vw <= 600 ? 48 : 64;
    var avail = Math.min(vw, 1120) - reserve;
    cellPx = Math.max(24, Math.min(38, Math.floor(avail / 10)));
    root.style.setProperty('--cell', cellPx + 'px');
  }

  function fmt(s) { return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }

  function occupied(ignore) {
    var m = {}, s = cur(), ps = P().pieces;
    Object.keys(s.placed).forEach(function (k) {
      var id = +k;
      if (id === ignore) return;
      var pos = s.placed[k];
      ps[id].cells.forEach(function (x) { m[(pos.r + x.r) + ',' + (pos.c + x.c)] = id; });
    });
    return m;
  }
  function canPlace(p, r0, c0, ignore) {
    var m = occupied(ignore);
    return p.cells.every(function (x) {
      var r = r0 + x.r, c = c0 + x.c;
      return r >= 0 && c >= 0 && r < N && c < N && !m[r + ',' + c];
    });
  }
  function touchesBoard(p, r0, c0) {
    return p.cells.some(function (x) { var r = r0 + x.r, c = c0 + x.c; return r >= 0 && c >= 0 && r < N && c < N; });
  }
  function isRight(id) {
    var q = cur().placed[id], p = P().pieces[id];
    return !!q && q.r === p.r0 && q.c === p.c0;
  }
  function allRight() { return P().pieces.every(function (p) { return isRight(p.id); }); }

  function pieceEl(p, opts) {
    var s = cur();
    var el = document.createElement('div');
    el.className = 'piece' + (opts.cls ? ' ' + opts.cls : '');
    el.dataset.id = p.id;
    el.style.width = 'calc(var(--cell) * ' + p.w + ')';
    el.style.height = 'calc(var(--cell) * ' + p.h + ')';
    el.style.setProperty('--fill', 'var(--p' + p.color + ')');
    var nums = [];
    p.cells.forEach(function (x) {
      var d = document.createElement('div');
      d.className = 'cell' + (x.t ? ' t' : '') + (x.b ? ' b' : '') + (x.l ? ' l' : '') + (x.rt ? ' r' : '');
      d.style.left = 'calc(var(--cell) * ' + x.c + ')';
      d.style.top = 'calc(var(--cell) * ' + x.r + ')';
      if (x.show) { d.textContent = x.n; nums.push(x.n); }
      else if (s.solved && !opts.ghost) { d.textContent = x.n; d.className += ' rev'; }
      el.appendChild(d);
    });
    el.setAttribute('aria-label', nums.length ? 'Piece showing ' + nums.join(', ') : 'Piece with no numbers');
    return el;
  }

  function render() {
    var s = cur(), pz = P(), ps = pz.pieces, n = ps.length;

    // tabs and description
    var tabs = $('tabs');
    tabs.textContent = '';
    puzzles.forEach(function (z, i) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'tab'; b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', i === idx ? 'true' : 'false');
      b.textContent = z.name;
      if (state[i].solved) {
        var t = document.createElement('span');
        t.className = 'tick'; t.textContent = '✓'; t.setAttribute('aria-label', 'completed');
        b.appendChild(t);
      }
      b.addEventListener('click', function () { idx = i; render(); });
      tabs.appendChild(b);
    });
    $('desc').textContent = pz.desc + ' (' + n + ' pieces)';

    // progress and timer
    var placedN = Object.keys(s.placed).length;
    $('progress').textContent = placedN + ' of ' + n + ' pieces on the board';
    $('timer').textContent = fmt(s.elapsed);

    // board
    board.textContent = '';
    Object.keys(s.placed).forEach(function (k) {
      var p = ps[+k], pos = s.placed[k];
      var cls = 'onboard' + (s.solved ? ' locked' : '') +
        (s.flash && s.flash.ids.indexOf(p.id) >= 0 ? ' wrong' : '') +
        (s.hint && s.hint.id === p.id ? ' hinted' : '');
      var el = pieceEl(p, { cls: cls });
      el.style.left = 'calc(var(--cell) * ' + pos.c + ')';
      el.style.top = 'calc(var(--cell) * ' + pos.r + ')';
      board.appendChild(el);
    });
    if (s.hint) {
      var hp = ps[s.hint.id];
      if (s.hint.level === 1) {
        var band = document.createElement('div');
        band.className = 'band';
        band.style.top = 'calc(var(--cell) * ' + hp.r0 + ')';
        band.style.height = 'calc(var(--cell) * ' + hp.h + ')';
        board.appendChild(band);
      } else {
        hp.cells.forEach(function (x) {
          var d = document.createElement('div');
          d.className = 'ht';
          d.style.left = 'calc(var(--cell) * ' + (hp.c0 + x.c) + ')';
          d.style.top = 'calc(var(--cell) * ' + (hp.r0 + x.r) + ')';
          board.appendChild(d);
        });
      }
    }

    // tray
    tray.textContent = '';
    var left = pz.order.filter(function (id) { return !s.placed.hasOwnProperty(id); });
    $('traynote').textContent = left.length ? left.length + ' to place. Tap a piece to select it.' : '';
    if (!left.length) {
      var e = document.createElement('p');
      e.className = 'empty';
      e.textContent = s.solved ? 'Every piece is in place.' : 'All pieces are on the board. Press Check to see if they are right.';
      tray.appendChild(e);
    }
    left.forEach(function (id) {
      var p = ps[id];
      var cls = (s.sel === id ? 'sel' : '') + (s.hint && s.hint.id === id ? ' hinted' : '');
      var el = pieceEl(p, { cls: cls });
      el.tabIndex = 0;
      el.setAttribute('role', 'button');
      el.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') {
          ev.preventDefault();
          cur().sel = cur().sel === id ? null : id;
          render();
        }
      });
      tray.appendChild(el);
    });

    // status and win
    var st = s.msg;
    if (!st && !s.solved) st = placedN ? '' : 'Drag a piece onto the board, or tap a piece and then tap a square.';
    $('status').textContent = st;
    $('win').hidden = !s.solved;
    if (s.solved) {
      $('winTitle').textContent = pz.name + ' complete';
      $('winText').textContent = 'Finished in ' + fmt(s.elapsed) + '. Every number from ' + pz.base + ' to ' + (pz.base + 99) + ' is now showing on the board.';
      $('next').textContent = idx < puzzles.length - 1 ? 'Next puzzle' : 'Back to Puzzle 1';
    }
    reportHeight();
  }

  function startClock() { var s = cur(); if (!s.started) { s.started = true; notifyParent('interacted'); } }

  function afterPlace() {
    var s = cur();
    if (allRight()) { s.solved = true; s.sel = null; s.msg = ''; s.hint = null; s.flash = null; notifyParent('solved'); }
  }
  function place(id, r, c) {
    var s = cur();
    s.placed[id] = { r: r, c: c };
    s.sel = null; s.msg = ''; s.hint = null; s.flash = null;
    afterPlace();
  }
  function unplace(id) { delete cur().placed[id]; }

  // ---- dragging ----
  var drag = null;
  var blockClickUntil = 0;
  function clearPreview() {
    Array.prototype.slice.call(board.querySelectorAll('.pv')).forEach(function (n) { n.remove(); });
  }
  function targetFor(e) {
    var br = board.getBoundingClientRect();
    return {
      r: Math.round((e.clientY - drag.oy - br.top) / cellPx),
      c: Math.round((e.clientX - drag.ox - br.left) / cellPx)
    };
  }
  function showPreview(p, t, ok) {
    clearPreview();
    p.cells.forEach(function (x) {
      var r = t.r + x.r, c = t.c + x.c;
      if (r < 0 || c < 0 || r >= N || c >= N) return;
      var d = document.createElement('div');
      d.className = 'pv ' + (ok ? 'ok' : 'no');
      d.style.left = 'calc(var(--cell) * ' + c + ')';
      d.style.top = 'calc(var(--cell) * ' + r + ')';
      board.appendChild(d);
    });
  }

  document.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    var pe = e.target.closest ? e.target.closest('.piece') : null;
    var s = cur();
    if (!pe || pe.classList.contains('ghost') || s.solved) return;
    var rect = pe.getBoundingClientRect();
    drag = {
      id: +pe.dataset.id, el: pe, sx: e.clientX, sy: e.clientY,
      ox: e.clientX - rect.left, oy: e.clientY - rect.top,
      moving: false, ghost: null, fromBoard: pe.classList.contains('onboard')
    };
    e.preventDefault();
  });

  window.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var p = P().pieces[drag.id];
    if (!drag.moving) {
      if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) < 7) return;
      drag.moving = true;
      startClock();
      drag.ghost = pieceEl(p, { cls: 'ghost', ghost: true });
      document.body.appendChild(drag.ghost);
      drag.el.classList.add('lifted');
    }
    drag.ghost.style.left = (e.clientX - drag.ox) + 'px';
    drag.ghost.style.top = (e.clientY - drag.oy) + 'px';
    var t = targetFor(e);
    if (touchesBoard(p, t.r, t.c)) showPreview(p, t, canPlace(p, t.r, t.c, drag.id));
    else clearPreview();
  });

  function endDrag(e, cancelled) {
    if (!drag) return;
    var d = drag, s = cur(), p = P().pieces[d.id];
    drag = null;
    blockClickUntil = Date.now() + 350;
    if (d.ghost) d.ghost.remove();
    clearPreview();
    if (d.moving) {
      if (cancelled) { render(); return; }
      var t = (function () {
        var br = board.getBoundingClientRect();
        return { r: Math.round((e.clientY - d.oy - br.top) / cellPx), c: Math.round((e.clientX - d.ox - br.left) / cellPx) };
      })();
      if (canPlace(p, t.r, t.c, d.id)) {
        place(d.id, t.r, t.c);
      } else if (d.fromBoard && !touchesBoard(p, t.r, t.c)) {
        unplace(d.id); s.msg = ''; s.hint = null; s.flash = null;
      } else if (touchesBoard(p, t.r, t.c)) {
        s.msg = 'That spot is taken, or the piece hangs over the edge. Try again.';
      }
      render();
      return;
    }
    // a tap
    startClock();
    if (d.fromBoard) { unplace(d.id); s.sel = d.id; s.msg = ''; s.flash = null; }
    else { s.sel = s.sel === d.id ? null : d.id; s.msg = ''; }
    render();
  }
  window.addEventListener('pointerup', function (e) { endDrag(e, false); });
  window.addEventListener('pointercancel', function (e) { endDrag(e, true); });

  // tap a board square to drop the selected piece there
  board.addEventListener('click', function (e) {
    if (e.target.closest('.piece') || Date.now() < blockClickUntil) return;
    var s = cur();
    if (s.solved) return;
    startClock();
    if (s.sel === null) { s.msg = 'Tap a piece in the tray first, then tap the board.'; render(); return; }
    var p = P().pieces[s.sel];
    var br = board.getBoundingClientRect();
    var r = Math.floor((e.clientY - br.top) / cellPx);
    var c = Math.floor((e.clientX - br.left) / cellPx) - p.anchorC;
    if (canPlace(p, r, c, p.id)) place(p.id, r, c);
    else s.msg = 'The piece does not fit there. The square you tap is where its top-left square goes.';
    render();
  });

  // ---- buttons ----
  var timers = { flash: null, hint: null };
  $('check').addEventListener('click', function () {
    var s = cur(), n = P().pieces.length;
    if (s.solved) return;
    var ids = Object.keys(s.placed).map(Number);
    if (!ids.length) { s.msg = 'Place a few pieces first, then press Check.'; render(); return; }
    var wrong = ids.filter(function (id) { return !isRight(id); });
    var good = ids.length - wrong.length, left = n - ids.length;
    var msg = good + ' of ' + n + ' pieces are in the right place.';
    if (wrong.length) msg += ' Pieces glowing red need another look.';
    else if (left) msg += ' Every piece you have placed is correct.';
    if (left) msg += ' ' + left + ' still in the tray.';
    s.msg = msg;
    var f = { ids: wrong };
    s.flash = f;
    clearTimeout(timers.flash);
    var when = idx;
    timers.flash = setTimeout(function () { if (state[when].flash === f) { state[when].flash = null; if (idx === when) render(); } }, 3000);
    render();
  });

  $('hint').addEventListener('click', function () {
    var s = cur(), ps = P().pieces;
    if (s.solved) return;
    startClock();
    var p = (s.sel !== null && !isRight(s.sel)) ? ps[s.sel] : null;
    if (!p) p = ps.filter(function (q) { return !isRight(q.id); })[0];
    if (!p) return;
    s.hl[p.id] = (s.hl[p.id] || 0) + 1;
    var h = { id: p.id, level: Math.min(2, s.hl[p.id]) };
    s.hint = h;
    s.msg = h.level === 1
      ? 'Hint: the glowing piece belongs somewhere in the shaded rows (rows ' + (p.r0 + 1) + ' to ' + (p.r0 + p.h) + ' from the top). Press Hint again to see its exact spot.'
      : 'Hint: the glowing piece fits in the dashed spot.';
    clearTimeout(timers.hint);
    var when = idx;
    timers.hint = setTimeout(function () {
      if (state[when].hint === h) { state[when].hint = null; state[when].msg = ''; if (idx === when) render(); }
    }, 6000);
    render();
  });

  $('reset').addEventListener('click', function () { state[idx] = fresh(); render(); });
  $('next').addEventListener('click', function () { idx = (idx + 1) % puzzles.length; render(); window.scrollTo(0, 0); });

  setInterval(function () {
    var s = cur();
    if (s.started && !s.solved) { s.elapsed++; $('timer').textContent = fmt(s.elapsed); }
  }, 1000);

  window.addEventListener('resize', function () { if (drag) return; fit(); render(); });

  if (window.ResizeObserver) {
    new ResizeObserver(reportHeight).observe(document.body);
  }
  window.addEventListener('load', reportHeight);
  setTimeout(reportHeight, 300); // catch late web-font reflow

  fit();
  render();
})();
</script>

</html>
